    </radialGradient>
    <radialGradient id="planet" cx=".72" cy=".21" r=".89">
      <stop stop-color="#e3d5e5"/><stop offset=".24" stop-color="#a89cbb"/><stop offset=".55" stop-color="#57627e"/><stop offset=".82" stop-color="#242941"/><stop offset="1" stop-color="#151729"/>
    </radialGradient>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#293647"/><stop offset="1" stop-color="#111624"/>
    </linearGradient>
    <linearGradient id="ring">
      <stop stop-color="#8fb4af"/><stop offset=".48" stop-color="#c5b4d4"/><stop offset="1" stop-color="#a1b9d5"/>
    </linearGradient>
    <filter id="dust" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".022 .05" numOctaves="4" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="frame"><rect width="880" height="390" rx="14"/></clipPath>
    <clipPath id="disk"><circle cx="574" cy="141" r="82"/></clipPath>
