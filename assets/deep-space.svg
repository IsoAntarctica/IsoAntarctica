    <style>
      .star { animation: shimmer 7s ease-in-out infinite alternate; }
      .star:nth-child(2n) { animation-delay: -4.5s; }
      .star:nth-child(3n) { animation-duration: 9s; animation-delay: -2s; }
      .ripple { animation: drift 11s ease-in-out infinite alternate; }
      .ripple + .ripple { animation-delay: -6s; animation-duration: 15s; }
      @keyframes shimmer { from { opacity: .32; } to { opacity: .95; } }
      @keyframes drift { from { transform: translateX(-9px); opacity: .28; } to { transform: translateX(11px); opacity: .61; } }
      @media (prefers-reduced-motion: reduce) { .star, .ripple { animation: none; } }
