<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390">
  <defs>
    <radialGradient id="sky" cx=".68" cy=".67" r=".78">
      <stop stop-color="#465e6c"/><stop offset=".49" stop-color="#292b49"/><stop offset="1" stop-color="#10101e"/>
    </radialGradient>
    <radialGradient id="violet">
