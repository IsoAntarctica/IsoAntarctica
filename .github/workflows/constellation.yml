name: Refresh constellation

on:
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-constellation

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_constellation.py "${{ github.repository_owner }}"
      - name: Publish updated stars
        run: |
          git add assets/constellation.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Refresh contribution stars'
          git push